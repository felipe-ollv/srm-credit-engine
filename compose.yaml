name: srm-credit-engine

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: srm_credit_engine
      POSTGRES_USER: srm
      POSTGRES_PASSWORD: srm
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srm -d srm_credit_engine"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/srm_credit_engine
      SPRING_DATASOURCE_USERNAME: srm
      SPRING_DATASOURCE_PASSWORD: srm
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
