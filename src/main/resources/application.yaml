spring:
  application:
    name: srm-credit-engine
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/srm-credit-engine}
          audiences:
            - ${JWT_AUDIENCE:srm-credit-engine-api}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/srm_credit_engine}
    username: ${SPRING_DATASOURCE_USERNAME:srm}
    password: ${SPRING_DATASOURCE_PASSWORD:srm}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  pricing:
    base-rate: ${PRICING_BASE_RATE:0.01}
    usd-brl-rate: ${FX_USD_BRL_RATE:5.4321}
    business-zone: ${BUSINESS_ZONE:America/Sao_Paulo}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
